name: evals

# Layers 1-3 against real models. Gated so they run rarely:
#   - monthly schedule: all tasks, activation evals, baseline PRs, on two
#     models (the free OpenCode one and Copilot)
#   - a PR labeled `run-evals`: only tasks touched by the PR (changed task
#     folder, or a changed skill the task loads), on the free model
#   - manual dispatch with inputs
#
# Each agent in a run is a profile (tools/bin/eval-profiles.ts): the A/B
# shards, the gate and the baseline run once per profile, so every model
# gets its own verdict. Retire a rule only when no profile shows an effect.
#
#   opencode  OpenCode with a free model. No account, no key, no secret.
#             Free models change; pick another with the `model` input
#             (`opencode models --standalone` lists them).
#   copilot   GitHub Copilot CLI, claude-haiku-4.5 by default (a third of a
#             premium request per session; a full run is about 900 sessions,
#             so about 300 premium requests). Needs the secret
#             COPILOT_GITHUB_TOKEN: a fine-grained personal access token with
#             the "Copilot Requests" permission.
#   claude    Claude Code. Needs the secret ANTHROPIC_API_KEY.
#
# A profile whose secret is missing FAILS the run (a silent skip looked green
# for weeks), except on labeled PRs from forks, which never see secrets and
# skip with a warning.
#
# The runner, gate and wrappers are tested with a fake agent (no model calls)
# by the tools job in validate.yml.

on:
  schedule:
    - cron: "0 6 1 * *" # 1st of the month, 06:00 UTC
  pull_request:
    types: [labeled]
  workflow_dispatch:
    inputs:
      agents:
        description: "Agents, one gate each (opencode = free model, no key; copilot = needs COPILOT_GITHUB_TOKEN; claude = needs ANTHROPIC_API_KEY)"
        type: choice
        options: [opencode, copilot, claude, "opencode,copilot"]
        default: opencode
      tasks:
        description: "Comma-separated task names (empty = all tasks)"
        default: ""
      repeats:
        description: "Runs per task and mode"
        default: "3"
      max_tasks:
        description: "Cap on the number of tasks (0 = no cap)"
        default: "0"
      shards:
        description: "Parallel A/B jobs per agent"
        default: "16"
      model:
        description: "Model for a single agent (empty = its default: opencode/mimo-v2.6-flash-free, claude-haiku-4.5 for copilot, sonnet for claude)"
        default: ""
      activation:
        description: "Run Layer 1 activation evals (~260 short sessions per agent)"
        type: boolean
        default: false
      baseline:
        description: "Open a PR per agent that commits the results as a baseline"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: evals-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

env:
  OPENCODE_VERSION: "2.0.27"
  CLAUDE_CODE_VERSION: "2.1.301"
  COPILOT_VERSION: "1.0.103"
  TASK_MAX_BUDGET_USD: "0.50"
  REPEATS: ${{ inputs.repeats || '3' }}

jobs:
  plan:
    if: >-
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' && github.event.label.name == 'run-evals')
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.guard.outputs.run }}
      profiles: ${{ steps.profiles.outputs.profiles }}
      count: ${{ steps.plan.outputs.count }}
      shards: ${{ steps.plan.outputs.shards }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Pick agents and models
        id: profiles
        env:
          EVAL_AGENTS: ${{ inputs.agents || (github.event_name == 'schedule' && 'opencode,copilot' || 'opencode') }}
          EVAL_MODEL: ${{ inputs.model || '' }}
        run: |
          profiles="$(node tools/bin/eval-profiles.ts)"
          echo "$profiles" | jq .
          echo "profiles=$profiles" >> "$GITHUB_OUTPUT"

      - name: Guard - agent credentials
        id: guard
        env:
          PROFILES: ${{ steps.profiles.outputs.profiles }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
          IS_FORK: ${{ github.event.pull_request.head.repo.fork || false }}
        run: |
          missing=""
          for agent in $(jq -r '.[].agent' <<<"$PROFILES"); do
            case "$agent" in
              claude) [ -n "${ANTHROPIC_API_KEY:-}" ] || missing="$missing claude:ANTHROPIC_API_KEY" ;;
              copilot) [ -n "${COPILOT_GITHUB_TOKEN:-}" ] || missing="$missing copilot:COPILOT_GITHUB_TOKEN" ;;
            esac
          done
          if [ -z "$missing" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          elif [ "$IS_FORK" = "true" ]; then
            echo "::warning::Fork PRs get no secrets; skipping model evals."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Missing secret(s):$missing. Add them under Settings > Secrets and variables > Actions, or run with agents=opencode."
            exit 1
          fi

      - name: Pick tasks and shards
        id: plan
        env:
          EVAL_TASKS: ${{ inputs.tasks || '' }}
          EVAL_MAX_TASKS: ${{ inputs.max_tasks || '0' }}
          EVAL_SHARDS: ${{ inputs.shards || '16' }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PROFILES: ${{ steps.profiles.outputs.profiles }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ] && [ -z "$EVAL_TASKS" ]; then
            git diff --name-only "$BASE_SHA"...HEAD > "$RUNNER_TEMP/changed.txt"
            export EVAL_CHANGED_FILES="$RUNNER_TEMP/changed.txt"
          fi
          plan="$(bash scripts/eval-plan.sh)"
          echo "$plan" | jq .
          echo "count=$(jq '.count' <<<"$plan")" >> "$GITHUB_OUTPUT"
          echo "shards=$(jq -c '.shards' <<<"$plan")" >> "$GITHUB_OUTPUT"
          {
            echo "$(jq '.count' <<<"$plan") task(s) in $(jq '.shards | length' <<<"$plan") shard(s) per agent:"
            jq -r '.[] | "- `\(.agent)`, model `\(.model)`"' <<<"$PROFILES"
          } >> "$GITHUB_STEP_SUMMARY"

      # Free models come and go. A gone model makes every session an agent
      # error, and each shard would retry for hours; fail here instead.
      - name: Preflight - every model answers
        if: steps.guard.outputs.run == 'true' && steps.plan.outputs.count != '0'
        env:
          PROFILES: ${{ steps.profiles.outputs.profiles }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
          EVAL_AGENT_RETRY_WAIT: "30"
        run: |
          mapfile -t profiles < <(jq -r '.[] | "\(.agent) \(.model)"' <<<"$PROFILES")
          for profile in "${profiles[@]}"; do
            read -r agent model <<<"$profile"
            echo "::group::$agent / $model"
            bash evals/runner/install-agent.sh "$agent"
            SKILLS_AGENT_CMD="$GITHUB_WORKSPACE/evals/runner/$agent-task.sh" TASK_MODEL="$model" \
              node tools/bin/agent-preflight.ts
            echo "::endgroup::"
          done

  activation:
    needs: plan
    if: >-
      needs.plan.outputs.run == 'true' &&
      (github.event_name == 'schedule' || inputs.activation == true)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        profile: ${{ fromJSON(needs.plan.outputs.profiles) }}
    env:
      EVAL_AGENT: ${{ matrix.profile.agent }}
      ACTIVATION_MODEL: ${{ matrix.profile.model }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Install agent CLI
        run: bash evals/runner/install-agent.sh "$EVAL_AGENT"

      - name: Layer 1 - activation evals
        env:
          SKILLS_ACTIVATION_CMD: ${{ github.workspace }}/evals/runner/${{ matrix.profile.agent }}-activation.sh
        run: bash scripts/run-activation-evals.sh

  ab:
    needs: plan
    if: needs.plan.outputs.run == 'true' && needs.plan.outputs.count != '0'
    runs-on: ubuntu-latest
    # 150 tasks x 2 modes x 3 repeats at about 2 min per free-model session
    # take about 2 h per shard with 16 shards. Results are appended per task
    # and uploaded even on timeout, so a slow shard loses one task, not all.
    timeout-minutes: 330
    strategy:
      fail-fast: false
      matrix:
        profile: ${{ fromJSON(needs.plan.outputs.profiles) }}
        shard: ${{ fromJSON(needs.plan.outputs.shards) }}
    env:
      EVAL_AGENT: ${{ matrix.profile.agent }}
      TASK_MODEL: ${{ matrix.profile.model }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
      SKILLS_AGENT_CMD: ${{ github.workspace }}/evals/runner/${{ matrix.profile.agent }}-task.sh
      SKILLS_PROFILE_CMD: ${{ github.workspace }}/evals/runner/skills-profile.sh
      EVAL_RESULTS: ${{ github.workspace }}/evals/.results/ab-${{ matrix.profile.id }}-${{ matrix.shard.id }}.jsonl
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: evals/tools/ast/package-lock.json

      - name: Install AST grader tools
        working-directory: evals/tools/ast
        run: npm ci

      - name: Install agent CLI
        run: bash evals/runner/install-agent.sh "$EVAL_AGENT"

      - name: Layers 2-3 - A/B per task
        env:
          SHARD_TASKS: ${{ matrix.shard.tasks }}
        run: |
          mkdir -p "$(dirname "$EVAL_RESULTS")"
          IFS=',' read -r -a tasks <<<"$SHARD_TASKS"
          for task in "${tasks[@]}"; do
            echo "::group::A/B $task"
            # ab.sh exit codes encode the verdict; the gate job decides.
            bash evals/runner/ab.sh "$task" "$REPEATS" || true
            echo "::endgroup::"
          done

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-ab-${{ matrix.profile.id }}-${{ matrix.shard.id }}
          path: evals/.results/ab-${{ matrix.profile.id }}-${{ matrix.shard.id }}.jsonl
          if-no-files-found: warn

  gate:
    needs: [plan, ab]
    if: always() && needs.plan.result == 'success' && needs.plan.outputs.run == 'true' && needs.plan.outputs.count != '0'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        profile: ${{ fromJSON(needs.plan.outputs.profiles) }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24'

      - uses: actions/download-artifact@v4
        with:
          pattern: eval-ab-${{ matrix.profile.id }}-*
          path: ${{ runner.temp }}/ab
          merge-multiple: true

      - name: Merge results
        run: |
          mkdir -p evals/.results
          cat "$RUNNER_TEMP"/ab/*.jsonl > evals/.results/ab.jsonl 2>/dev/null || true
          wc -l evals/.results/ab.jsonl

      - name: Compare with the latest baseline of this agent
        env:
          PROFILE_ID: ${{ matrix.profile.id }}
        run: |
          latest=""
          if [ -d evals/baselines ]; then
            latest="$(find evals/baselines -name "*-${PROFILE_ID}.jsonl" | sort | tail -n1)"
          fi
          if [ -n "$latest" ]; then
            bash scripts/eval-diff.sh "$latest" evals/.results/ab.jsonl >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Gate
        run: |
          set -o pipefail
          bash scripts/eval-gate.sh evals/.results/ab.jsonl | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-results-${{ matrix.profile.id }}
          path: evals/.results/ab.jsonl

  baseline:
    needs: [plan, gate]
    if: >-
      always() && needs.plan.result == 'success' && needs.plan.outputs.run == 'true' && needs.plan.outputs.count != '0' &&
      (github.event_name == 'schedule' || inputs.baseline == true) &&
      (needs.gate.result == 'success' || needs.gate.result == 'failure')
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        profile: ${{ fromJSON(needs.plan.outputs.profiles) }}
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24'

      - uses: actions/download-artifact@v4
        with:
          name: eval-results-${{ matrix.profile.id }}
          path: ${{ runner.temp }}/results

      - name: Open baseline PR
        env:
          GH_TOKEN: ${{ github.token }}
          PROFILE_ID: ${{ matrix.profile.id }}
          EVAL_AGENT: ${{ matrix.profile.agent }}
          TASK_MODEL: ${{ matrix.profile.model }}
        run: |
          day="$(date -u +%Y-%m-%d)"
          file="evals/baselines/${day}-${PROFILE_ID}.jsonl"
          branch="eval-baseline/${day}-${PROFILE_ID}-${GITHUB_RUN_ID}"
          if [ ! -s "$RUNNER_TEMP/results/ab.jsonl" ]; then
            echo "::error::No A/B results to record for ${PROFILE_ID}; no baseline PR."
            exit 1
          fi
          # Before find: the folder does not exist until the first baseline.
          mkdir -p evals/baselines
          previous="$(find evals/baselines -name "*-${PROFILE_ID}.jsonl" | sort | tail -n1)"
          cp "$RUNNER_TEMP/results/ab.jsonl" "$file"

          {
            echo "A/B baseline (agent \`${EVAL_AGENT}\`, model \`${TASK_MODEL}\`) from run ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}."
            echo
            if [ -n "$previous" ]; then
              bash scripts/eval-diff.sh "$previous" "$file"
              echo
            fi
            bash scripts/eval-gate.sh "$file" || true
          } > "$RUNNER_TEMP/body.md"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add "$file"
          git commit -m "chore(evals): record ${PROFILE_ID} A/B baseline ${day}"
          git push origin "$branch"
          gh pr create --base main --head "$branch" \
            --title "chore(evals): ${PROFILE_ID} A/B baseline ${day}" \
            --body-file "$RUNNER_TEMP/body.md"
