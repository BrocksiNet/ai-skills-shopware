name: validate

# Cheap, deterministic checks. Runs on every push/PR. No model calls, no secrets.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-skills:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Validate skill structure, budgets and conflicts
        run: bash scripts/validate-skills.sh

      - name: Activation evals (dry mode — file presence + prompt parsing)
        run: bash scripts/run-activation-evals.sh

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Lint shell scripts
        run: |
          mapfile -t files < <(
            find evals/smoke evals/runner scripts evals evals/tools/ast -maxdepth 1 -name '*.sh' -type f | sort
          )
          shellcheck "${files[@]}"

  grader-golden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: evals/tools/ast/package-lock.json

      - name: Install AST grader tools
        working-directory: evals/tools/ast
        run: npm ci

      - name: AST snippet tests
        working-directory: evals/tools/ast
        run: node --test

      - name: Golden grader tests (no model calls)
        run: bash evals/test-graders.sh

  tools:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: tools/package-lock.json

      - name: Install repo tooling
        working-directory: tools
        run: npm ci

      - name: Type check
        working-directory: tools
        run: npm run typecheck

      - name: Lint (oxlint, type-aware)
        working-directory: tools
        run: npm run lint

      - name: Format check (oxfmt)
        working-directory: tools
        run: npm run format:check

      - name: Unit tests
        working-directory: tools
        run: npm test

  markdown-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Lint Markdown
        uses: DavidAnson/markdownlint-cli2-action@v23
        with:
          globs: |
            **/*.md
            !node_modules
            !**/node_modules/**
            !evals/tasks/**/fixture/**/*.md
            !evals/tasks/**/fixtures/**/*.md
