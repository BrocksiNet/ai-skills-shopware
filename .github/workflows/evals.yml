name: evals

# Layers 1-3 against real models. These cost money, so they are gated:
#   - weekly schedule: all tasks, activation evals, baseline PR
#   - a PR labeled `run-evals`: only tasks touched by the PR (changed task
#     folder, or a changed skill the task loads)
#   - manual dispatch with inputs
#
# Requires the repository secret ANTHROPIC_API_KEY. Without it, scheduled and
# dispatched runs FAIL (a silent skip looked green for weeks). Labeled PRs from
# forks, which never see secrets, are skipped with a warning.
#
# Self-test of the runner and gate (no model calls) runs in validate.yml.

on:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  pull_request:
    types: [labeled]
  workflow_dispatch:
    inputs:
      tasks:
        description: "Comma-separated task names (empty = all tasks)"
        default: ""
      repeats:
        description: "Runs per task and mode"
        default: "3"
      max_tasks:
        description: "Cap on the number of tasks (0 = no cap)"
        default: "0"
      shards:
        description: "Parallel A/B jobs"
        default: "4"
      model:
        description: "Claude model alias for tasks and activation"
        default: "sonnet"
      activation:
        description: "Run Layer 1 activation evals (~260 short sessions)"
        type: boolean
        default: false
      baseline:
        description: "Open a PR that commits the results as a baseline"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: evals-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

env:
  CLAUDE_CODE_VERSION: "2.1.301"
  TASK_MODEL: ${{ inputs.model || 'sonnet' }}
  ACTIVATION_MODEL: ${{ inputs.model || 'sonnet' }}
  TASK_MAX_BUDGET_USD: "0.50"
  REPEATS: ${{ inputs.repeats || '3' }}

jobs:
  plan:
    if: >-
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' && github.event.label.name == 'run-evals')
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.guard.outputs.run }}
      count: ${{ steps.plan.outputs.count }}
      shards: ${{ steps.plan.outputs.shards }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Guard - require ANTHROPIC_API_KEY
        id: guard
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          IS_FORK: ${{ github.event.pull_request.head.repo.fork || false }}
        run: |
          if [ -n "${ANTHROPIC_API_KEY:-}" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          elif [ "$IS_FORK" = "true" ]; then
            echo "::warning::Fork PRs get no secrets; skipping model evals."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "::error::ANTHROPIC_API_KEY is not set. Add it under Settings > Secrets and variables > Actions."
            exit 1
          fi

      - name: Pick tasks and shards
        id: plan
        env:
          EVAL_TASKS: ${{ inputs.tasks || '' }}
          EVAL_MAX_TASKS: ${{ inputs.max_tasks || '0' }}
          EVAL_SHARDS: ${{ inputs.shards || '4' }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ] && [ -z "$EVAL_TASKS" ]; then
            git diff --name-only "$BASE_SHA"...HEAD > "$RUNNER_TEMP/changed.txt"
            export EVAL_CHANGED_FILES="$RUNNER_TEMP/changed.txt"
          fi
          plan="$(bash scripts/eval-plan.sh)"
          echo "$plan" | jq .
          echo "count=$(jq '.count' <<<"$plan")" >> "$GITHUB_OUTPUT"
          echo "shards=$(jq -c '.shards' <<<"$plan")" >> "$GITHUB_OUTPUT"
          echo "Selected $(jq '.count' <<<"$plan") task(s) in $(jq '.shards | length' <<<"$plan") shard(s)." >> "$GITHUB_STEP_SUMMARY"

  activation:
    needs: plan
    if: >-
      needs.plan.outputs.run == 'true' &&
      (github.event_name == 'schedule' || inputs.activation == true)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install Claude Code CLI
        run: npm install -g "@anthropic-ai/claude-code@${CLAUDE_CODE_VERSION}"

      - name: Layer 1 - activation evals
        env:
          SKILLS_ACTIVATION_CMD: ${{ github.workspace }}/evals/runner/claude-activation.sh
        run: bash scripts/run-activation-evals.sh

  ab:
    needs: plan
    if: needs.plan.outputs.run == 'true' && needs.plan.outputs.count != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.shards) }}
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      SKILLS_AGENT_CMD: ${{ github.workspace }}/evals/runner/claude-task.sh
      SKILLS_PROFILE_CMD: ${{ github.workspace }}/evals/runner/claude-profile.sh
      EVAL_RESULTS: ${{ github.workspace }}/evals/.results/ab-${{ matrix.shard.id }}.jsonl
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: evals/tools/ast/package-lock.json

      - name: Install AST grader tools
        working-directory: evals/tools/ast
        run: npm ci

      - name: Install Claude Code CLI
        run: npm install -g "@anthropic-ai/claude-code@${CLAUDE_CODE_VERSION}"

      - name: Layers 2-3 - A/B per task
        env:
          SHARD_TASKS: ${{ matrix.shard.tasks }}
        run: |
          mkdir -p "$(dirname "$EVAL_RESULTS")"
          IFS=',' read -r -a tasks <<<"$SHARD_TASKS"
          for task in "${tasks[@]}"; do
            echo "::group::A/B $task"
            # ab.sh exit codes encode the verdict; the gate job decides.
            bash evals/runner/ab.sh "$task" "$REPEATS" || true
            echo "::endgroup::"
          done

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-ab-${{ matrix.shard.id }}
          path: evals/.results/ab-${{ matrix.shard.id }}.jsonl
          if-no-files-found: warn

  gate:
    needs: [plan, ab]
    if: always() && needs.plan.outputs.run == 'true' && needs.plan.outputs.count != '0'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v4
        with:
          pattern: eval-ab-*
          path: ${{ runner.temp }}/ab
          merge-multiple: true

      - name: Merge results
        run: |
          mkdir -p evals/.results
          cat "$RUNNER_TEMP"/ab/*.jsonl > evals/.results/ab.jsonl 2>/dev/null || true
          wc -l evals/.results/ab.jsonl

      - name: Compare with the latest baseline
        run: |
          latest="$(find evals/baselines -name '*.jsonl' 2>/dev/null | sort | tail -n1)"
          if [ -n "$latest" ]; then
            bash scripts/eval-diff.sh "$latest" evals/.results/ab.jsonl >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Gate
        run: |
          set -o pipefail
          bash scripts/eval-gate.sh evals/.results/ab.jsonl | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-results
          path: evals/.results/ab.jsonl

  baseline:
    needs: [plan, gate]
    if: >-
      always() && needs.plan.outputs.run == 'true' && needs.plan.outputs.count != '0' &&
      (github.event_name == 'schedule' || inputs.baseline == true) &&
      (needs.gate.result == 'success' || needs.gate.result == 'failure')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v4
        with:
          name: eval-results
          path: ${{ runner.temp }}/results

      - name: Open baseline PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          day="$(date -u +%Y-%m-%d)"
          branch="eval-baseline/${day}-${GITHUB_RUN_ID}"
          previous="$(find evals/baselines -name '*.jsonl' 2>/dev/null | sort | tail -n1)"
          mkdir -p evals/baselines
          cp "$RUNNER_TEMP/results/ab.jsonl" "evals/baselines/${day}.jsonl"

          {
            echo "Weekly A/B baseline from run ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}."
            echo
            if [ -n "$previous" ]; then
              bash scripts/eval-diff.sh "$previous" "evals/baselines/${day}.jsonl"
              echo
            fi
            bash scripts/eval-gate.sh "evals/baselines/${day}.jsonl" || true
          } > "$RUNNER_TEMP/body.md"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add "evals/baselines/${day}.jsonl"
          git commit -m "chore(evals): record A/B baseline ${day}"
          git push origin "$branch"
          gh pr create --base main --head "$branch" \
            --title "chore(evals): A/B baseline ${day}" \
            --body-file "$RUNNER_TEMP/body.md"
