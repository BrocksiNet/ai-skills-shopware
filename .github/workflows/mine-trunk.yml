name: mine-trunk

# Weekly drift mining (plan WP8, WP12). Lists what changed in every source
# of rules/sources.json since docs/.mining-state.json. On shopware/shopware
# trunk: agent skill bullets, coding guideline headings, review guide rule
# IDs, the PR template, and PHPStan and Danger rule classes. In the upstream
# skill repositories: Markdown bullets and headings. Each change is mapped to
# the skill and rule it touches through rules/catalog.json and the skills'
# routes.json.
#
#   - schedule (Monday 05:00 UTC, before evals.yml) and manual dispatch open
#     or update this week's issue labeled `trunk-drift` (`mine-trunk.ts run`).
#     An older open `trunk-drift` issue is closed as superseded when the new
#     report reaches at least as far in every source it lists; the others
#     stay open. A dispatch with `dry_run` only prints the report and the
#     issue plan to the job log and the artifact.
#   - a `/mined` comment by a member or collaborator on a `trunk-drift` issue
#     opens a PR that moves every source's state to the commit the report
#     ends at, then closes the issue. `/mined shopware php-modernization`
#     moves only those sources and leaves the issue open. A state only ever
#     moves to the end of a report, so never past unread deltas, and never
#     back.
#
# No model calls and no secrets beyond GITHUB_TOKEN.

on:
  schedule:
    - cron: "0 5 * * 1" # Monday 05:00 UTC
  workflow_dispatch:
    inputs:
      dry_run:
        description: Print the report and the issue plan; open, update or close no issue
        type: boolean
        default: false
  issue_comment:
    types: [created]

permissions:
  contents: read

jobs:
  report:
    if: github.event_name != 'issue_comment'
    runs-on: ubuntu-latest
    concurrency: mine-trunk-report
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Download the review signals
        # Written daily by collect-reviews.yml. Without the release yet, the
        # report has no review section.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/review-signals"
          if gh release view review-signals > /dev/null 2>&1; then
            gh release download review-signals --dir "$RUNNER_TEMP/review-signals" --pattern '*.jsonl' || true
          fi

      - name: Mine every source since its last state and file the issue
        env:
          GH_TOKEN: ${{ github.token }}
          DRY_RUN: ${{ inputs.dry_run && '--dry-run' || '' }}
        run: |
          # shellcheck disable=SC2086 # DRY_RUN is empty or one flag
          node tools/bin/mine-trunk.ts run $DRY_RUN --reviews "$RUNNER_TEMP/review-signals" \
            --repo "$GITHUB_REPOSITORY" --out "$RUNNER_TEMP/report.md" \
            --run-url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trunk-drift
          path: ${{ runner.temp }}/report.md
          if-no-files-found: ignore

  mined:
    if: >-
      github.event_name == 'issue_comment' && !github.event.issue.pull_request &&
      contains(github.event.issue.labels.*.name, 'trunk-drift') &&
      startsWith(github.event.comment.body, '/mined') &&
      contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association)
    runs-on: ubuntu-latest
    concurrency: mine-trunk-state
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Open the state PR and close the issue
        env:
          GH_TOKEN: ${{ github.token }}
          BODY: ${{ github.event.issue.body }}
          ISSUE: ${{ github.event.issue.number }}
          ACTOR: ${{ github.event.comment.user.login }}
          COMMENT: ${{ github.event.comment.body }}
        run: |
          printf '%s' "$BODY" | node tools/bin/mine-trunk.ts advance --comment "$COMMENT"
          # `/mined` alone covers the whole report; with source names, the issue stays open.
          all="$(printf '%s' "$COMMENT" | head -n1 | tr -d '[:space:]')"
          if git diff --quiet -- docs/.mining-state.json; then
            if [ "$all" = "/mined" ]; then
              gh issue close "$ISSUE" --comment "The mining state is already at the end of this report."
            else
              gh issue comment "$ISSUE" --body "The named sources are already at the end of this report."
            fi
            exit 0
          fi
          sha="$(node -p 'require("./docs/.mining-state.json").shopware.last_sha.slice(0, 8)')"
          branch="mining-state/${ISSUE}-${sha}"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add docs/.mining-state.json
          git commit -m "chore(mining): mined up to trunk ${sha}"
          git push origin "$branch"
          url="$(gh pr create --base main --head "$branch" \
            --title "chore(mining): mined up to trunk ${sha}" \
            --body "Moves \`docs/.mining-state.json\` to the end of #${ISSUE}, marked mined by @${ACTOR}.")"
          if [ "$all" = "/mined" ]; then
            gh issue close "$ISSUE" --comment "Marked mined by @${ACTOR}. State PR: ${url}"
          else
            gh issue comment "$ISSUE" --body "Sources marked mined by @${ACTOR}. State PR: ${url}"
          fi
