name: publish-shopware-api

# Publishes the bundled shopware-api.mjs as the npm package in
# tools/api-index/npm. The skills run it with `npx shopware-api-index@<version>`,
# pinned to the version in tools/api-index/npm/package.json, so publish that
# version before a skill change that pins it reaches main. Manual only.
#
#   - Stages the version in npm/package.json with `npm stage publish`; a
#     prerelease such as 0.1.0-beta.0 goes to the `beta` dist-tag, anything
#     else to `latest`.
#   - No token: npm trusts this workflow file (trusted publishing over OIDC)
#     and allows it to stage only. A maintainer approves the staged version
#     with 2FA on npmjs.com before it goes live.
#   - dry_run packs and lists the files without publishing.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Pack only, do not publish
        type: boolean
        default: true

permissions:
  contents: read

concurrency: publish-shopware-api

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm trusted publishing (OIDC) and provenance
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org

      - name: Bundle into the package
        run: |
          npm ci --prefix tools/api-index
          node tools/api-index/bin/bundle.ts --out tools/api-index/npm/shopware-api.mjs
          cp LICENSE tools/api-index/npm/LICENSE

      - name: The packed bundle runs
        working-directory: tools/api-index/npm
        run: |
          npm pack --dry-run
          node shopware-api.mjs --help

      # Staged publishing needs npm 11.15.0 or newer.
      - name: Update npm
        if: ${{ !inputs.dry_run }}
        run: npm install -g npm@latest

      - name: Stage the release
        if: ${{ !inputs.dry_run }}
        working-directory: tools/api-index/npm
        run: |
          case "$(node -p "require('./package.json').version")" in
            *-*) tag=beta ;;
            *) tag=latest ;;
          esac
          npm stage publish --access public --tag "$tag"
          echo "::notice::Staged. Approve it on npmjs.com (2FA) to make it live."
